# SPDX-License-Identifier: GPL-3.0-only
name: CI AoC

on:
  push:
    branches: [develop, main, master]
    tags: ['v*']
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publicar ambos ZIP en GitHub Releases
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-22.04
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      linux_runner: ${{ steps.runner.outputs.label }}
      windows_runner: ${{ steps.windows-runner.outputs.label }}
    steps:
      - name: Validar el runner Linux de L4D2
        id: runner
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          L4D2_EXT_LINUX_RUNNER: ${{ vars.L4D2_EXT_LINUX_RUNNER }}
        run: |
          if [[ -z "${L4D2_EXT_LINUX_RUNNER//[[:space:]]/}" ]]; then
            echo "::error::Falta L4D2_EXT_LINUX_RUNNER. Configúrala en AoC-Gamers y habilítala para este repositorio."
            exit 1
          fi
          printf 'label=%s\n' "$L4D2_EXT_LINUX_RUNNER" >>"$GITHUB_OUTPUT"
      - name: Validar el runner Windows de L4D2
        id: windows-runner
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          L4D2_EXT_WINDOWS_RUNNER: ${{ vars.L4D2_EXT_WINDOWS_RUNNER }}
        run: |
          if [[ -z "${L4D2_EXT_WINDOWS_RUNNER//[[:space:]]/}" ]]; then
            echo "::error::Falta L4D2_EXT_WINDOWS_RUNNER. Configúrala en AoC-Gamers y habilítala para este repositorio."
            exit 1
          fi
          printf 'label=%s\n' "$L4D2_EXT_WINDOWS_RUNNER" >>"$GITHUB_OUTPUT"
      - name: Determinar canal o versión
        id: release
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
            pull_request:*) channel="${GITHUB_SHA:0:12}" ;;
            *:branch:main|*:branch:master) channel=latest ;;
            *:branch:develop) channel=develop ;;
            *:tag:v[0-9]*) channel="${GITHUB_REF_NAME#v}" ;;
            *:tag:*) echo "El tag debe comenzar con v y un número." >&2; exit 1 ;;
            *) channel="${GITHUB_SHA:0:12}" ;;
          esac
          if [[ ! "$channel" =~ ^(develop|latest|[0-9a-f]{7,12}|[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?)$ ]]; then
            echo "Nombre de versión inválido" >&2
            exit 1
          fi
          printf 'channel=%s\n' "$channel" >>"$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Preparar toolchain Linux x86
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++-multilib
      - run: make test-ci PYTHON=python
      - run: make test-native-sanitized

  build:
    if: github.event_name != 'pull_request'
    needs: [test, identity]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ${{ needs.identity.outputs.linux_runner }}
          - platform: windows
            runner: ${{ needs.identity.outputs.windows_runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Comprobar la credencial del SDK
        shell: bash
        env:
          SDK_TOKEN: ${{ secrets.STEAMWORKS_SDK_TOKEN }}
        run: |
          if [[ -z "$SDK_TOKEN" || "$SDK_TOKEN" == PENDIENTE_CONFIGURAR ]]; then
            echo "Configura el secreto STEAMWORKS_SDK_TOKEN con acceso de lectura al SDK de AoC." >&2
            exit 1
          fi
      - name: Obtener Steamworks SDK 1.55 de AoC
        uses: actions/checkout@v6
        with:
          repository: AoC-Gamers/Steamworks-SDK
          ref: a7aaa2754d9cda244d0cd9d7523c1144a1c472d2
          path: .deps/steamworks-sdk
          token: ${{ secrets.STEAMWORKS_SDK_TOKEN }}
          persist-credentials: false
      - name: Preparar toolchain Linux x86
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make g++-multilib
      - name: Preparar GNU Make en Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --no-progress -y
            exit $LASTEXITCODE
          }
      - name: Preparar dependencias, compilar y verificar ZIP
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          STEAMWORKS_SDK_DIR: ${{ github.workspace }}/.deps/steamworks-sdk/sdk_155
          RELEASE_CHANNEL: ${{ needs.identity.outputs.channel }}
        run: |
          make "deps-exts-$PLATFORM" PYTHON=python
          make "build-exts-$PLATFORM" PYTHON=python
          if [[ "$PLATFORM" == linux ]]; then make test-abi test-vsp PYTHON=python; fi
          make "package-exts-$PLATFORM" PYTHON=python
          make "release-$PLATFORM" PYTHON=python
          make "validate-artifact-$PLATFORM" PYTHON=python
      - name: Guardar ZIP verificado
        uses: actions/upload-artifact@v7
        with:
          path: dist/release/*.zip
          if-no-files-found: error
          archive: false
          overwrite: true

  publish:
    needs: [identity, build]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release &&
      (github.ref_name == 'develop' || github.ref_name == 'master' || github.ref_name == 'main' ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))))
    runs-on: ubuntu-22.04
    concurrency:
      group: publish-sourcetv
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: sourcetvsupport-${{ needs.identity.outputs.channel }}-*.zip
          merge-multiple: true
          skip-decompress: true
          path: dist/release
      - name: Publicar los dos ZIP validados
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STEAMWORKS_SDK_DIR: ${{ github.workspace }}/.deps/steamworks-sdk/sdk_155
          RELEASE_CHANNEL: ${{ needs.identity.outputs.channel }}
        run: bash scripts/ci/publish-release.sh sourcetvsupport "$RELEASE_CHANNEL"
